<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Scan — Intokozo Scan Nhlangano</title>
<meta name="description" content="Book your pregnancy or ultrasound scan at Intokozo Scan Nhlangano online.">
<link rel="icon" href="data:,">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f3effa}
iframe{border:0;width:100%;height:100%;display:block}
</style>
<!-- Google Ads tag (account 749-439-0356). On this top-level page Google can see
     the ad click (gclid), which it can't inside the Apps Script frame. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18476314182"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','AW-18476314182');
</script>
</head>
<body>
<!--
  Google Ads landing page for Intokozo Scan Nhlangano (built 14 Nov 2026).
  The booking form itself is the Apps Script web app, iframed so the "created
  by a Google Apps Script user" bar never shows. This page:
   1. forwards the ad click id (gclid / gbraid / wbraid) into the form, which
      stores it with the booking (no patient details) in the "Ads Clicks" tab;
   2. fires the "Online booking (booking page)" conversion when the form says a
      booking was confirmed. Only value, currency and a random transaction id
      ever reach Google, never patient details.
  Source: Desktop/Intokozo/ads-landing on the owner's Mac.
-->
<iframe id="book" title="Book a scan" allow="clipboard-write"></iframe>
<script>
(function(){
  var EXEC='https://script.google.com/macros/s/AKfycbzNzrOcuR54fvMP_-jTrH5F7DIKjUuHk0d3fIge9Vc30LuprVQUM6hG-LAVWZ4ET5VCcQ/exec';
  var q=new URLSearchParams(location.search), clean=function(v,n){return String(v||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,n);};
  var src=clean(q.get('src'),20)||'google';
  var u=EXEC+'?view=book&branch=nhlangano&src='+encodeURIComponent(src)+'&host=ads';
  ['gclid','gbraid','wbraid'].some(function(k){
    var v=clean(q.get(k),200); if(v){u+='&'+k+'='+encodeURIComponent(v); return true;} return false;
  });
  document.getElementById('book').src=u;

  var sent={};
  window.addEventListener('message',function(e){
    if(!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var d=e.data||{};
    if(d.type!=='intokozo-booked'||!d.conversion) return;
    var c=d.conversion, tid=clean(c.transaction_id,40);
    if(!tid||sent[tid]) return; sent[tid]=1;
    gtag('event','conversion',{
      send_to:'AW-18476314182/NE-eCInywZ0dEMbcmOpE',
      value:Number(c.value)||1,
      currency:c.currency==='SZL'?'SZL':'ZAR',
      transaction_id:tid
    });
  });
})();
</script>
</body>
</html>
